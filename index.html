<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0a00">
  <title>Ravali Church</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    video, .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      padding: 20px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      color: #fff;
    }

    .subtitle {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 30px;
      opacity: 0.9;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .church-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .input-group {
      width: 100%;
      max-width: 320px;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1rem;
      outline: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: #ffd700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
    }

    .btn {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #c9a227, #ffd700);
      color: #1a0a00;
    }

    .btn-primary:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: transparent;
      color: #ffd700;
      border: 1.5px solid #ffd700;
      margin-top: 12px;
    }

    .btn-secondary:active {
      background: rgba(255, 215, 0, 0.15);
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.9rem;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .success-msg {
      color: #69f0ae;
      font-size: 0.95rem;
      margin-top: 10px;
      text-align: center;
    }

    /* Welcome animation */
    .welcome-text {
      font-size: 2.4rem;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s ease forwards 0.3s;
      text-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }

    .welcome-sub {
      font-size: 1.3rem;
      margin-top: 12px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards 0.8s;
      color: #ffd700;
    }
