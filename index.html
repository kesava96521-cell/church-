<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0a00">
  <title>Ravali</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .screen.active {
      display: flex;
    }

    video, .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      padding: 20px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      color: #fff;
    }

    .input-group {
      width: 100%;
      max-width: 300px;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    .btn {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 6px;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.32);
    }

    .btn-secondary {
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      margin-top: 14px;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .error-msg {
      color: #ff8a80;
      font-size: 0.9rem;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Start button */
    .start-btn {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 14px 40px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .start-btn:active {
      transform: scale(0.97);
    }
